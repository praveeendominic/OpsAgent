<rect width="1160" height="1019" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" font-weight="700" fill="#1F2933" text-anchor="start">OpsAgent: one Flow, six crews, from alarm to an approved fix in under five minutes</text>
<text x="30" y="60" font-size="11" font-weight="400" fill="#5F6B7A" text-anchor="start">Orange outline = the only components that can change infrastructure, used after a human approval. Only the CloudWatch agent, metrics, logs and alarms exist today; everything from the enricher down is proposed.</text>
