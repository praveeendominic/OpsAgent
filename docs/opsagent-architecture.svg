<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1019" width="1160" height="1019" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="OpsAgent: one Flow, six crews, from alarm to an approved fix in under five minutes">
