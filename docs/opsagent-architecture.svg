<text x="42" y="421" font-size="13" font-weight="700" fill="#1B5E20" text-anchor="start">CREWAI INCIDENTFLOW  ·  one persisted state, six crews</text>
<rect x="50.0" y="445" width="340.0" height="86" rx="8" fill="#FFFFFF" stroke="#43A047" stroke-width="1.5"/>
<text x="220.0" y="476.0" font-size="13" font-weight="700" fill="#1F2933" text-anchor="middle">Triage</text>
