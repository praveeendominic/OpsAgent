[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsagent"
version = "0.1.0"
description = "OpsAgent: agentic L1/L2 incident response built on CrewAI Flows (proof of concept)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "crewai>=1.12,<2",
  "crewai-tools>=1.12,<2",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "faiss-cpu>=1.9",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "pyyaml>=6",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
tracing = ["mlflow>=3.1"]

[project.scripts]
opsagent = "opsagent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsagent = ["crews/*/config/*.yaml", "kb/docs/*.md", "notify/templates/*", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs the Azure OpenAI deployment and network"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
